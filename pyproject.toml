[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "beesknees-mcp"
version = "0.1.2"
description = "The Bee's Knees — a monetized multiplayer race to the queen, on Tollbooth DPYC"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Lonnie VanZandt" }]

dependencies = [
    "fastmcp>=3.4.7",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    # [modal] for the sim-bee runner: the swarm that fills a thin hive lives in a
    # Modal app, and the extra is what puts the client in the same resolution the
    # MCP already uses rather than a second list that drifts from it.
    "tollbooth-dpyc[nostr,modal]==0.90.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.22.0",
]

[tool.setuptools.packages.find]
where = ["src"]

# `llms.txt` is served by the `beesknees_guide` tool, so it must be INSIDE the
# wheel — not merely in the repository. Without this the tool imports fine in a
# checkout and raises FileNotFoundError the first time it runs on Horizon.
[tool.setuptools.package-data]
beesknees_mcp = ["llms.txt"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
