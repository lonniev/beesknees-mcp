name: Deploy Modal Sim Bees

# `modal_app.py` is where the sim bees actually LIVE. Horizon serves the MCP and
# Cloudflare serves the page; the swarm that keeps a thin hive playable — and
# that now seats the first bee into an empty lobby so nobody has to be the one
# who starts something — runs only in this container.
#
# Nothing deployed it. It was pushed by hand four times on 2026-09-07, each with
# an uncommitted tree, and then main moved fifty commits. Six of those touched
# the swarm, including the greeter (#49). On the evening of 2026-09-08 the owner
# watched an empty lobby sit at 0/8 and reasonably concluded the sim bees only
# join once a human has funded a bee — which was true of the code that was
# RUNNING, and had not been true of the code on main for an hour. The feature
# was merged, green, and inert.
#
# The image builds from `pyproject.toml` and mounts `src` at DEPLOY time.
# `add_local_python_source` skips an image *rebuild* on a code change — it does
# not skip the redeploy. So a source change with no redeploy leaves Modal
# running code that exists nowhere else. Hence the deliberately wide paths
# filter: this is not a "modal_app.py changed" trigger, it is a "what Modal
# executes changed" trigger.
on:
  push:
    branches: [main]
    paths:
      - "modal_app.py"
      - "src/beesknees_mcp/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy-modal.yml"
  # The release gate. `release.yml` creates the GitHub Release on a `v*` tag;
  # this fires on that and checks out the RELEASED tag rather than whatever main
  # has drifted to, so the container runs the commit that was actually released.
  release:
    types: [published]
  # Manual, because the first run of this workflow fails for want of the Modal
  # tokens and there is otherwise no way to retry it except by pushing an
  # unrelated change to the swarm.
  workflow_dispatch:

concurrency:
  # Two deploys racing would leave the live version decided by whichever
  # finished last.
  group: deploy-modal
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

      # MUST match `debian_slim(python_version=...)` in modal_app.py. The
      # resolution happens on THIS runner at deploy time, so a runner on a
      # Python the dependencies publish no wheels for falls back to building
      # from source and fails — while CI stays green on its own version. That
      # is how eXcalibur's deploy failed every run for a fortnight.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: The runner's Python matches the image it deploys
        run: |
          set -euo pipefail
          IMAGE_PY=$(grep -oE 'python_version="[0-9]+\.[0-9]+"' modal_app.py | head -1 | grep -oE '[0-9]+\.[0-9]+')
          RUNNER_PY=$(python -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')
          echo "image=$IMAGE_PY runner=$RUNNER_PY"
          if [ "$IMAGE_PY" != "$RUNNER_PY" ]; then
            echo "::error::modal_app.py builds a Python $IMAGE_PY image but this runner is $RUNNER_PY."
            exit 1
          fi

      # Poll the SIMPLE index, because that is what pip resolves from. The JSON
      # API publishes seconds ahead of it, so a gate on the JSON API passes and
      # the install that follows still fails. A gate is only a gate if it waits
      # on the thing the next step actually needs.
      - name: Wait for tollbooth-dpyc on PyPI
        run: |
          set -euo pipefail
          REQUIRED=$(grep -oE 'tollbooth-dpyc(\[[a-z,]+\])?==[0-9.]+' pyproject.toml \
                     | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ -z "$REQUIRED" ]; then
            echo "No pinned tollbooth-dpyc version found; nothing to wait for."
            exit 0
          fi
          echo "Waiting for tollbooth-dpyc==$REQUIRED on the PyPI simple index..."
          ESCAPED=${REQUIRED//./\\.}
          for i in $(seq 1 30); do
            # Distribution filenames carry the version; match the dash-delimited
            # form so 0.90.0 cannot be satisfied by 0.90.01.
            if curl -sf "https://pypi.org/simple/tollbooth-dpyc/" \
                 | grep -qE "tollbooth[_-]dpyc-$ESCAPED[-.]"; then
              echo "Found tollbooth-dpyc==$REQUIRED on the simple index (attempt $i)"
              exit 0
            fi
            echo "Attempt $i/30 — not yet resolvable by pip, waiting 10s..."
            sleep 10
          done
          echo "::error::tollbooth-dpyc==$REQUIRED never reached the PyPI simple index after 5 minutes."
          exit 1

      - uses: astral-sh/setup-uv@v10.0.1

      - name: Install dependencies (the lockfile Horizon deploys)
        run: uv sync --locked

      # A DEPLOY credential, deliberately not the operator's identity.
      #
      # What the swarm RUNS AS is a throwaway key per bee, minted in the
      # container. What AUTHORIZES a deploy is a platform token. This job
      # performs only the second, so it holds only the second. The tempting
      # alternative — give CI the nsec and read the Modal tokens out of the
      # operator vault — would hand a build runner the credential that unlocks
      # every operator secret in order to obtain the weakest one in the system.
      # A Modal token can redeploy an app; it cannot open the vault.
      #
      # Every command goes through `uv run`, because the step above installs
      # into `.venv` and nothing has activated it. Bare `modal` resolves to the
      # runner's system interpreter, which has neither the client nor the
      # project — optionality shipped eight days of "deployed" that never left
      # the runner on exactly that.
      #
      # The invariant is "the live container runs THIS commit's content", which
      # is not the same as "a version stamped with this commit exists". Modal
      # deduplicates: when the image, the function spec and the mounted source
      # are byte-identical to what is live it cuts no new version and says "no
      # changes detected". That is the invariant HOLDING, not failing — and it
      # is the common case, because the paths filter is wider than the image.
      - name: Deploy to Modal and verify the live version
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${MODAL_TOKEN_ID:-}" ] || [ -z "${MODAL_TOKEN_SECRET:-}" ]; then
            echo "::error::MODAL_TOKEN_ID / MODAL_TOKEN_SECRET are not set on this repo."
            echo "Until they are, the swarm ships only when somebody runs"
            echo "\`modal deploy modal_app.py\` by hand — which is the gap this exists to close."
            exit 1
          fi

          APP=$(uv run python -c "import modal_app; print(modal_app.app.name)")
          EXPECTED=$(git rev-parse --short HEAD)

          # tee so the deploy output is still in the log we assert against.
          uv run modal deploy modal_app.py 2>&1 | tee "$RUNNER_TEMP/modal-deploy.log"

          if grep -q 'no changes detected' "$RUNNER_TEMP/modal-deploy.log"; then
            echo "$APP already runs this commit's content — Modal cut no new version."
            exit 0
          fi

          # A new version WAS cut, so it must carry this commit. Modal stamps
          # each version with the commit it was deployed from; anything else
          # means the deploy took from a tree that is not the one checked out.
          # Every hand deploy before this workflow is stamped with a `*` for
          # "repo had uncommitted changes", which is the same doubt in the
          # platform's own words.
          HISTORY=$(COLUMNS=200 uv run modal app history "$APP")
          echo "$HISTORY"
          if ! echo "$HISTORY" | grep -q "$EXPECTED"; then
            echo "::error::$APP cut a new version, but not at $EXPECTED"
            exit 1
          fi
          echo "$APP is live at $EXPECTED"
