# The scheduler worker deploys from main like the frontend does, so a change to
# how it calls the MCP reaches Cloudflare with the change that needs it instead
# of waiting for someone to run wrangler by hand.
name: Deploy scheduler worker

on:
  push:
    branches: [main]
    paths:
      - "scheduler-worker/**"
      - ".github/workflows/deploy-scheduler-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # wrangler runs on Node. Without this step it ran on whatever Node the
      # runner image shipped; check-latest takes the newest patched 24.x.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          check-latest: true
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: scheduler-worker
          command: deploy
